[project]
name = "a-share-etf-quant"
version = "0.20.0"
description = "A-share ETF quantitative research and paper-trading project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "akshare>=1.18,<2",
    "duckdb>=1.4,<2",
    "httpx>=0.28,<1",
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "pyarrow>=18,<24",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
    "tenacity>=9,<10",
]

[project.scripts]
quant-check = "a_share_quant.main:main"
quant-data = "a_share_quant.data.cli:main"
quant-account = "a_share_quant.accounting.cli:main"
quant-execution = "a_share_quant.execution.cli:main"
quant-cost = "a_share_quant.execution.cost_cli:main"
quant-backtest = "a_share_quant.backtest.cli:main"
quant-robustness = "a_share_quant.backtest.robustness_cli:main"
quant-diagnose = "a_share_quant.backtest.diagnostics_cli:main"
quant-candidate = "a_share_quant.backtest.structural_cli:main"
quant-factor = "a_share_quant.backtest.factor_cli:main"
quant-expand = "a_share_quant.data.expanded_cli:main"
quant-factor-expanded = "a_share_quant.backtest.expanded_factor_cli:main"
quant-risk-budget = "a_share_quant.backtest.risk_budget_cli:main"
quant-multiasset = "a_share_quant.data.multi_asset_cli:main"
quant-risk-multiasset = "a_share_quant.backtest.multi_asset_risk_cli:main"
quant-forward-check = "a_share_quant.backtest.forward_validation_cli:main"
quant-paper = "a_share_quant.paper.cli:main"
quant-daily-update = "a_share_quant.data.incremental_cli:main"
quant-paper-gui = "a_share_quant.paper.gui:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a_share_quant"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

